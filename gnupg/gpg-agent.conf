# Use pinentry-mac so the GPG signing passphrase is stored in the macOS Keychain.
# Enter it once (tick "Save in Keychain") and gpg-agent retrieves it silently after.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Keep the unlocked key cached generously (seconds): 8h idle, 24h max.
default-cache-ttl 28800
max-cache-ttl 86400
